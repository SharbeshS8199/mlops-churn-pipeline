# Local stack: MLflow tracking server + the API.   make up
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --artifacts-destination /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: [mlflow:/mlflow]
  api:
    build: .
    ports: ["8080:8080"]
    volumes: ["./logs:/app/logs"]
volumes:
  mlflow:
