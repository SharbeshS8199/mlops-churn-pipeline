name: retrain
# Triggered by the drift monitor (or by hand). Retrains on the latest labelled data, applies the
# same quality gate against the current champion, and redeploys only if the new model is not worse.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e .
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Pull latest labelled data and current champion metrics
        run: |
          mkdir -p data models/champion
          gcloud storage cp "gs://${{ vars.GCS_BUCKET }}/data/latest.csv" data/WA_Fn-UseC_-Telco-Customer-Churn.csv
          gcloud storage cp "gs://${{ vars.GCS_BUCKET }}/models/champion/metrics.json" models/champion/ || true
      - run: python -m churn.validate
      - name: Train with gate
        run: python -m churn.train
      - name: Publish new champion and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gcloud storage cp -r models/champion "gs://${{ vars.GCS_BUCKET }}/models/"
          gh workflow run cd.yml
