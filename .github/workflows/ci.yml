name: ci
# Every push / PR: tests -> data validation -> train -> quality gate -> container build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-train-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e '.[api,dev]'
      - name: Unit tests
        run: pytest -q
      - name: Data validation
        run: python -m churn.validate
      - name: Train + quality gate (fails the build if the model is worse)
        run: python -m churn.train
      - name: Smoke-test the API in-process
        run: |
          python - <<'EOF'
          from fastapi.testclient import TestClient
          from app.main import app
          c = TestClient(app)
          assert c.get("/health").json()["status"] == "ok"
          r = c.post("/predict", json={"customers": [{"tenure": 2, "MonthlyCharges": 95, "TotalCharges": 190}]})
          assert r.status_code == 200 and 0 <= r.json()["predictions"][0]["churn_probability"] <= 1
          print("API OK")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/champion/
      - name: Build container
        run: docker build -t churn-api:${{ github.sha }} .
