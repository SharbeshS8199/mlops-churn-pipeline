[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-mlops"
version = "0.1.0"
description = "End-to-end MLOps: tracking, gated training, CI/CD to Cloud Run, drift monitoring"
authors = [{ name = "Sharbesh S" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.4", "scipy>=1.11", "joblib>=1.3", "pyyaml>=6.0"]

[project.optional-dependencies]
tracking = ["mlflow>=2.14"]
monitor = ["evidently>=0.4"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "requests>=2.31"]
dev = ["pytest>=8"]
all = ["churn-mlops[tracking,monitor,api,dev]"]

[project.urls]
Author = "https://github.com/SharbeshS8199"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
